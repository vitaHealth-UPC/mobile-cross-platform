name: tata
description: Tata cross-platform mobile application
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0

  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/illustrations/
    - assets/fonts/DancingScript-OFL.txt
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/DMSerifDisplay-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_regular.ttf
          weight: 400
        - asset: assets/fonts/inter_medium.ttf
          weight: 500
        - asset: assets/fonts/inter_semibold.ttf
          weight: 600
        - asset: assets/fonts/inter_bold.ttf
          weight: 700
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/dm_serif_display.ttf
    - family: DancingScript
      fonts:
        - asset: assets/fonts/dancing_script_bold.ttf
          weight: 700
